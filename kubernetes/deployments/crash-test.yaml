apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-crash-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-crash-test
  template:
    metadata:
      labels:
        app: kube-crash-test
    spec:
      containers:
        - name: crash-test
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "echo Simulated application failure; exit 1"