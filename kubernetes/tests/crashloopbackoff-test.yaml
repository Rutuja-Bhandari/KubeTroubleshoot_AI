
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloopbackoff-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloopbackoff-test
  template:
    metadata:
      labels:
        app: crashloopbackoff-test
    spec:
      containers:
        - name: crash-test
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Simulated application failure"
              exit 1
